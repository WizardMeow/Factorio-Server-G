name: factorio-server-g

services:
  webui:
    build:
      context: .
      network: host
      args:
        HTTP_PROXY: "${BUILD_HTTP_PROXY:-}"
        HTTPS_PROXY: "${BUILD_HTTPS_PROXY:-}"
        NO_PROXY: "${BUILD_NO_PROXY:-localhost,127.0.0.1}"
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmmirror.com}"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    ports:
      - "${WEBUI_BIND_ADDRESS:-${FACTORIO_BIND_ADDRESS:-127.0.0.1}}:${WEBUI_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      FACTORIO_PORT: "${FACTORIO_PORT:-34197}"
      PROJECT_ROOT: /project
      FRONTEND_ROOT: /app/dist
      HOST_PROJECT_ROOT: "${HOST_PROJECT_ROOT:?Set HOST_PROJECT_ROOT to this repository's absolute host path}"
      HTTP_PROXY: "${OUTBOUND_HTTP_PROXY:-}"
      HTTPS_PROXY: "${OUTBOUND_HTTPS_PROXY:-}"
      NO_PROXY: "${OUTBOUND_NO_PROXY:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${HOST_PROJECT_ROOT:?Set HOST_PROJECT_ROOT to this repository's absolute host path}/compose.yaml:/project/compose.yaml:ro"
      - "${HOST_PROJECT_ROOT:?Set HOST_PROJECT_ROOT to this repository's absolute host path}/.env:/project/.env:ro"
      - "${HOST_PROJECT_ROOT:?Set HOST_PROJECT_ROOT to this repository's absolute host path}/config:/project/config"
      - "${HOST_PROJECT_ROOT:?Set HOST_PROJECT_ROOT to this repository's absolute host path}/runtime:/project/runtime"
    working_dir: /app

  factorio:
    image: "factoriotools/factorio:${FACTORIO_VERSION:-2.0.77}"
    restart: "no"
    stop_grace_period: 2m
    ports:
      - "${FACTORIO_BIND_ADDRESS:-0.0.0.0}:${FACTORIO_PORT:-34197}:34197/udp"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      LOAD_LATEST_SAVE: "false"
      SAVE_NAME: "${FACTORIO_SAVE_NAME:-_autosave1}"
      GENERATE_NEW_SAVE: "false"
      UPDATE_MODS_ON_START: "false"
      USERNAME: "${FACTORIO_USERNAME:-}"
      TOKEN: "${FACTORIO_TOKEN:-}"
    volumes:
      - "${FACTORIO_DATA_PATH:-${HOST_PROJECT_ROOT:?Set HOST_PROJECT_ROOT to this repository's absolute host path}/runtime/profiles/p1/factorio}:/factorio"
